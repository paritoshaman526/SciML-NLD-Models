name: sciml-bifurcations
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - pytorch>=2.0.0
  - cpuonly  # or cudatoolkit if GPU available
  - numpy>=1.24.0
  - scipy>=1.10.0
  - matplotlib>=3.7.0
  - numba>=0.57.0
  - tqdm>=4.65.0
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
